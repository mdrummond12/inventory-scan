<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Physical Count · Inventory Scanner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script>
<style>
  :root {
    --bg: #0c0a09;
    --surface: #1c1917;
    --surface-2: #292524;
    --border: #44403c;
    --ink: #fafaf9;
    --muted: #a8a29e;
    --accent: #f59e0b;
    --accent-glow: rgba(245, 158, 11, 0.35);
    --success: #84cc16;
    --danger: #ef4444;
    --info: #38bdf8;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overscroll-behavior: none;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    background-image:
      radial-gradient(circle at 20% 0%, rgba(245, 158, 11, 0.08), transparent 50%),
      radial-gradient(circle at 80% 100%, rgba(132, 204, 22, 0.05), transparent 50%);
  }

  .app {
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    max-width: 540px;
    margin: 0 auto;
    position: relative;
  }

  /* ─── HEADER ─── */
  header {
    padding: 18px 22px 10px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
  }
  .brand {
    font-family: 'Fraunces', serif;
    font-weight: 800;
    font-size: 24px;
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .brand em {
    font-style: italic;
    font-weight: 400;
    color: var(--accent);
  }
  .session-badge {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    padding: 5px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .session-badge strong {
    color: var(--accent);
    font-weight: 700;
  }

  /* ─── VIEWPORT ─── */
  .viewport {
    position: relative;
    margin: 8px 22px 0;
    border-radius: 20px;
    overflow: hidden;
    background: #000;
    border: 1px solid var(--border);
    box-shadow: 0 20px 40px -16px rgba(0,0,0,0.6);
    aspect-ratio: 4 / 3;
    flex-shrink: 0;
  }
  #video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .placeholder {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 24px;
    background: linear-gradient(135deg, var(--surface), var(--surface-2));
  }
  .placeholder svg {
    width: 48px;
    height: 48px;
    color: var(--accent);
    margin-bottom: 14px;
    opacity: 0.85;
  }
  .placeholder h2 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 18px;
    letter-spacing: -0.01em;
    margin-bottom: 6px;
  }
  .placeholder p {
    font-size: 11px;
    color: var(--muted);
    line-height: 1.5;
    max-width: 260px;
  }
  .placeholder.hidden { display: none; }

  .reticle {
    position: absolute;
    inset: 0;
    pointer-events: none;
    display: none;
  }
  .reticle.active { display: block; }
  .corner {
    position: absolute;
    width: 24px;
    height: 24px;
    border: 2px solid var(--accent);
    box-shadow: 0 0 12px var(--accent-glow);
  }
  .corner.tl { top: 24%; left: 10%; border-right: none; border-bottom: none; border-radius: 12px 0 0 0; }
  .corner.tr { top: 24%; right: 10%; border-left: none; border-bottom: none; border-radius: 0 12px 0 0; }
  .corner.bl { bottom: 24%; left: 10%; border-right: none; border-top: none; border-radius: 0 0 0 12px; }
  .corner.br { bottom: 24%; right: 10%; border-left: none; border-top: none; border-radius: 0 0 12px 0; }

  .scanline {
    position: absolute;
    top: 24%;
    left: 10%;
    right: 10%;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    box-shadow: 0 0 12px var(--accent);
    animation: scan 2s ease-in-out infinite;
  }
  @keyframes scan {
    0%, 100% { transform: translateY(0); opacity: 0.4; }
    50% { transform: translateY(140%); opacity: 1; }
  }

  /* ─── ENTRY CARD ─── */
  .entry {
    margin: 14px 22px 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 16px;
    transition: border-color 0.3s, box-shadow 0.3s;
  }
  .entry.armed {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-glow);
  }
  .entry-row {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
  }
  .field-label {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.22em;
    color: var(--muted);
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
  }
  .field-label .fmt { color: var(--accent); font-weight: 700; }

  .barcode-display {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    line-height: 1.3;
    color: var(--ink);
    word-break: break-all;
    min-height: 24px;
    padding: 10px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .barcode-display.empty {
    color: var(--muted);
    font-style: italic;
    font-weight: 400;
    font-size: 13px;
  }
  .barcode-display.editable {
    cursor: text;
  }
  .barcode-input {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--accent);
    border-radius: 10px;
    color: var(--ink);
    font-family: 'Fraunces', serif;
    font-size: 18px;
    padding: 10px 12px;
    outline: none;
  }

  .qty-row {
    display: grid;
    grid-template-columns: 48px 1fr 48px;
    gap: 8px;
    align-items: stretch;
  }
  .qty-input {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--ink);
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 28px;
    text-align: center;
    padding: 10px;
    outline: none;
    -moz-appearance: textfield;
  }
  .qty-input::-webkit-outer-spin-button,
  .qty-input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .qty-input:focus { border-color: var(--accent); }

  .qty-btn {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--ink);
    font-family: inherit;
    font-size: 22px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .qty-btn:active { transform: scale(0.92); background: var(--accent); color: #1c1917; }

  /* ─── PRIMARY ACTIONS ─── */
  .actions {
    margin: 12px 22px 0;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: 10px;
  }

  button {
    font-family: inherit;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    font-weight: 700;
    padding: 16px 18px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    cursor: pointer;
    transition: transform 0.12s, background 0.2s, border-color 0.2s, opacity 0.2s;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  button:active { transform: scale(0.97); }
  button:disabled { opacity: 0.35; cursor: not-allowed; }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #1c1917;
  }
  .btn-primary:hover:not(:disabled) { background: #fbbf24; }

  .btn-success {
    background: var(--success);
    border-color: var(--success);
    color: #1c1917;
  }

  .btn-icon {
    width: 52px;
    padding: 16px 0;
  }

  /* ─── COUNTS LIST ─── */
  .counts-section {
    margin: 18px 22px 22px;
    flex: 1;
  }
  .counts-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 10px;
    padding: 0 4px;
  }
  .counts-title {
    font-family: 'Fraunces', serif;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .counts-meta {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--muted);
  }
  .counts-meta strong { color: var(--accent); }

  .counts-list {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    max-height: 360px;
    overflow-y: auto;
  }
  .counts-empty {
    padding: 28px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    font-style: italic;
  }
  .count-row {
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    align-items: center;
  }
  .count-row:last-child { border-bottom: none; }
  .count-row.merged { background: rgba(245, 158, 11, 0.06); }

  .count-info {
    overflow: hidden;
  }
  .count-code {
    font-family: 'Fraunces', serif;
    font-size: 14px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .count-meta {
    font-size: 9px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-top: 2px;
  }
  .count-qty {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--accent);
    min-width: 44px;
    text-align: right;
  }
  .delete-btn {
    width: 32px;
    height: 32px;
    padding: 0;
    border-radius: 8px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .delete-btn:hover {
    color: var(--danger);
    border-color: var(--danger);
  }

  /* ─── EXPORT BAR ─── */
  .export-bar {
    margin: 0 22px 24px;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }
  .export-bar button {
    padding: 12px 8px;
    font-size: 10px;
    letter-spacing: 0.12em;
  }

  /* ─── TOAST + ERROR ─── */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--success);
    color: #1c1917;
    padding: 12px 22px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.16em;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 100;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    max-width: 90%;
    text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.info { background: var(--info); }
  .toast.warn { background: var(--accent); }

  .error-banner {
    margin: 12px 22px 0;
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: var(--danger);
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 11px;
    line-height: 1.5;
    display: none;
  }
  .error-banner.show { display: block; }

  /* ─── MERGE TOGGLE ─── */
  .merge-toggle {
    margin: 8px 22px 0;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    color: var(--muted);
  }
  .switch {
    position: relative;
    width: 36px;
    height: 20px;
    background: var(--surface-2);
    border-radius: 999px;
    cursor: pointer;
    border: 1px solid var(--border);
    transition: background 0.2s;
  }
  .switch::after {
    content: '';
    position: absolute;
    top: 1px;
    left: 1px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--muted);
    transition: transform 0.2s, background 0.2s;
  }
  .switch.on { background: var(--accent); border-color: var(--accent); }
  .switch.on::after { transform: translateX(16px); background: #1c1917; }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">stock<em>·</em>count</div>
    <span class="session-badge">Session <strong id="sessionId">—</strong></span>
  </header>

  <div class="viewport">
    <video id="video" playsinline muted autoplay></video>
    <div class="placeholder" id="placeholder">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="3" height="16"/>
        <rect x="8" y="4" width="1" height="16"/>
        <rect x="11" y="4" width="2" height="16"/>
        <rect x="15" y="4" width="1" height="16"/>
        <rect x="18" y="4" width="3" height="16"/>
      </svg>
      <h2>Tap Start to begin counting</h2>
      <p>Scan an item, enter the physical quantity, and add it to the session.</p>
    </div>
    <div class="reticle" id="reticle">
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
      <div class="scanline"></div>
    </div>
  </div>

  <div class="error-banner" id="errorBanner"></div>

  <div class="entry" id="entryCard">
    <div class="entry-row">
      <div>
        <div class="field-label">
          <span>Item / Barcode</span>
          <span class="fmt" id="formatTag"></span>
        </div>
        <div class="barcode-display empty editable" id="barcodeDisplay">Scan or tap here to enter manually</div>
      </div>

      <div>
        <div class="field-label"><span>Physical Count</span><span id="qtyHint"></span></div>
        <div class="qty-row">
          <button class="qty-btn" id="qtyMinus" title="Decrease">−</button>
          <input class="qty-input" id="qtyInput" type="number" inputmode="numeric" pattern="[0-9]*" value="1" min="0" step="1" />
          <button class="qty-btn" id="qtyPlus" title="Increase">+</button>
        </div>
      </div>
    </div>
  </div>

  <div class="actions">
    <button class="btn-primary" id="addBtn" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"/>
        <line x1="5" y1="12" x2="19" y2="12"/>
      </svg>
      Add to Count
    </button>
    <button class="btn-icon" id="toggleBtn" title="Toggle camera">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
        <circle cx="12" cy="13" r="4"/>
      </svg>
    </button>
  </div>

  <div class="merge-toggle">
    <span>Merge duplicate scans (sum quantities)</span>
    <div class="switch on" id="mergeSwitch"></div>
  </div>

  <div class="counts-section">
    <div class="counts-header">
      <div class="counts-title">Session Counts</div>
      <div class="counts-meta"><strong id="itemCount">0</strong> items · <strong id="totalQty">0</strong> units</div>
    </div>
    <div class="counts-list" id="countsList">
      <div class="counts-empty">No items counted yet</div>
    </div>
  </div>

  <div class="export-bar">
    <button id="exportCsvBtn" disabled>Export CSV</button>
    <button id="exportJsonBtn" disabled>Export JSON</button>
    <button id="clearBtn" disabled>Clear All</button>
  </div>

</div>

<div class="toast" id="toast">Saved</div>

<script>
/* ════════════════════════════════════════════════════════════════
   INVENTORY SCAN-AND-COUNT
   ────────────────────────────────────────────────────────────────
   To POST entries to your inventory API instead of (or in addition
   to) exporting, fill in `submitToApi` below — see the marked spot.
   ════════════════════════════════════════════════════════════════ */

const STORAGE_KEY = 'stockcount.session.v1';
const SESSION_ID  = (() => {
  // Stable session id for this device, regenerated when "Clear All" is hit
  let id = localStorage.getItem('stockcount.sid');
  if (!id) {
    id = 'S' + Date.now().toString(36).toUpperCase().slice(-6);
    localStorage.setItem('stockcount.sid', id);
  }
  return id;
})();

// ─── DOM ───
const videoEl = document.getElementById('video');
const placeholder = document.getElementById('placeholder');
const reticle = document.getElementById('reticle');
const sessionIdEl = document.getElementById('sessionId');
const barcodeDisplay = document.getElementById('barcodeDisplay');
const formatTag = document.getElementById('formatTag');
const qtyInput = document.getElementById('qtyInput');
const qtyPlus = document.getElementById('qtyPlus');
const qtyMinus = document.getElementById('qtyMinus');
const qtyHint = document.getElementById('qtyHint');
const addBtn = document.getElementById('addBtn');
const toggleBtn = document.getElementById('toggleBtn');
const entryCard = document.getElementById('entryCard');
const countsList = document.getElementById('countsList');
const itemCountEl = document.getElementById('itemCount');
const totalQtyEl = document.getElementById('totalQty');
const exportCsvBtn = document.getElementById('exportCsvBtn');
const exportJsonBtn = document.getElementById('exportJsonBtn');
const clearBtn = document.getElementById('clearBtn');
const mergeSwitch = document.getElementById('mergeSwitch');
const toast = document.getElementById('toast');
const errorBanner = document.getElementById('errorBanner');

sessionIdEl.textContent = SESSION_ID;

// ─── State ───
let codeReader = null;
let scanning = false;
let currentBarcode = '';
let currentFormat = '';
let mergeDuplicates = true;
let counts = []; // {id, barcode, format, qty, ts}
let lastScannedBarcode = '';
let lastScanTime = 0;

// ─── Persistence ───
function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ counts, mergeDuplicates }));
  } catch(e) {}
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    counts = Array.isArray(data.counts) ? data.counts : [];
    mergeDuplicates = data.mergeDuplicates !== false;
    mergeSwitch.classList.toggle('on', mergeDuplicates);
  } catch(e) {}
}

// ─── UI helpers ───
function showToast(msg, kind = 'success') {
  toast.textContent = msg;
  toast.className = 'toast' + (kind !== 'success' ? ' ' + kind : '');
  toast.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toast.classList.remove('show'), 1800);
}

function showError(msg) {
  errorBanner.textContent = msg;
  errorBanner.classList.add('show');
}
function clearError() { errorBanner.classList.remove('show'); }

function vibrate(pattern = 60) {
  if (navigator.vibrate) navigator.vibrate(pattern);
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

// ─── Barcode entry display ───
function setBarcode(value, format = '') {
  currentBarcode = (value || '').trim();
  currentFormat = format || '';
  if (currentBarcode) {
    barcodeDisplay.textContent = currentBarcode;
    barcodeDisplay.classList.remove('empty');
    formatTag.textContent = currentFormat;
    entryCard.classList.add('armed');
    addBtn.disabled = false;
    // Show last-known qty for this code if it exists
    const existing = counts.find(c => c.barcode === currentBarcode);
    qtyHint.textContent = existing && mergeDuplicates ? `current: ${existing.qty}` : '';
  } else {
    barcodeDisplay.textContent = 'Scan or tap here to enter manually';
    barcodeDisplay.classList.add('empty');
    formatTag.textContent = '';
    entryCard.classList.remove('armed');
    addBtn.disabled = true;
    qtyHint.textContent = '';
  }
}

// Allow tapping barcode display to type manually
barcodeDisplay.addEventListener('click', () => {
  if (barcodeDisplay.querySelector('input')) return;
  const initial = barcodeDisplay.classList.contains('empty') ? '' : currentBarcode;
  const input = document.createElement('input');
  input.className = 'barcode-input';
  input.value = initial;
  input.placeholder = 'Type barcode / SKU…';
  barcodeDisplay.replaceWith(input);
  input.focus();
  input.select();
  const commit = () => {
    const val = input.value.trim();
    input.replaceWith(barcodeDisplay);
    setBarcode(val, val ? 'MANUAL' : '');
  };
  input.addEventListener('blur', commit);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); commit(); qtyInput.focus(); qtyInput.select(); }
    if (e.key === 'Escape') { input.value = initial; commit(); }
  });
});

// ─── Quantity controls ───
qtyPlus.addEventListener('click', () => {
  qtyInput.value = (parseInt(qtyInput.value, 10) || 0) + 1;
});
qtyMinus.addEventListener('click', () => {
  qtyInput.value = Math.max(0, (parseInt(qtyInput.value, 10) || 0) - 1);
});
qtyInput.addEventListener('focus', () => qtyInput.select());

// ─── Add to count ───
addBtn.addEventListener('click', () => {
  if (!currentBarcode) return;
  const qty = parseInt(qtyInput.value, 10);
  if (isNaN(qty) || qty < 0) {
    showToast('Enter a valid quantity', 'warn');
    return;
  }

  let merged = false;
  if (mergeDuplicates) {
    const existing = counts.find(c => c.barcode === currentBarcode);
    if (existing) {
      existing.qty += qty;
      existing.ts = Date.now();
      existing.merged = true;
      merged = true;
    }
  }
  if (!merged) {
    counts.unshift({
      id: 'C' + Date.now().toString(36),
      barcode: currentBarcode,
      format: currentFormat,
      qty,
      ts: Date.now()
    });
  } else {
    // Move merged item to top
    counts = [counts.find(c => c.barcode === currentBarcode), ...counts.filter(c => c.barcode !== currentBarcode)];
  }

  saveState();
  renderCounts();
  vibrate([40, 30, 80]);
  showToast(merged ? `+${qty} merged into ${currentBarcode}` : `Added ${qty} × ${currentBarcode}`);

  /* ════════════════════════════════════════════════════════════
     OPTIONAL: POST to your inventory API here
     ────────────────────────────────────────────────────────────
     Uncomment and adapt:

     submitToApi({
       sessionId: SESSION_ID,
       barcode: currentBarcode,
       format: currentFormat,
       qty,
       ts: new Date().toISOString()
     });
     ════════════════════════════════════════════════════════════ */

  // Reset for next item
  setBarcode('', '');
  qtyInput.value = '1';
});

// ─── Render counts list ───
function renderCounts() {
  if (!counts.length) {
    countsList.innerHTML = '<div class="counts-empty">No items counted yet</div>';
    itemCountEl.textContent = '0';
    totalQtyEl.textContent = '0';
    exportCsvBtn.disabled = true;
    exportJsonBtn.disabled = true;
    clearBtn.disabled = true;
    return;
  }

  countsList.innerHTML = counts.map(c => `
    <div class="count-row${c.merged ? ' merged' : ''}" data-id="${c.id}">
      <div class="count-info">
        <div class="count-code">${escapeHtml(c.barcode)}</div>
        <div class="count-meta">${escapeHtml(c.format || 'unknown')} · ${new Date(c.ts).toLocaleTimeString()}</div>
      </div>
      <div class="count-qty">${c.qty}</div>
      <button class="delete-btn" data-id="${c.id}" title="Remove">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"/>
          <path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/>
        </svg>
      </button>
    </div>
  `).join('');

  countsList.querySelectorAll('.delete-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const id = btn.dataset.id;
      counts = counts.filter(c => c.id !== id);
      saveState();
      renderCounts();
      vibrate(40);
    });
  });

  // Tap row to re-load that barcode for another count
  countsList.querySelectorAll('.count-row').forEach(row => {
    row.addEventListener('click', () => {
      const item = counts.find(c => c.id === row.dataset.id);
      if (item) {
        setBarcode(item.barcode, item.format);
        qtyInput.focus();
        qtyInput.select();
      }
    });
  });

  itemCountEl.textContent = counts.length;
  totalQtyEl.textContent = counts.reduce((s, c) => s + (c.qty || 0), 0);
  exportCsvBtn.disabled = false;
  exportJsonBtn.disabled = false;
  clearBtn.disabled = false;
}

// ─── Merge toggle ───
mergeSwitch.addEventListener('click', () => {
  mergeDuplicates = !mergeDuplicates;
  mergeSwitch.classList.toggle('on', mergeDuplicates);
  saveState();
  if (currentBarcode) setBarcode(currentBarcode, currentFormat); // refresh hint
});

// ─── Export ───
function downloadFile(filename, content, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

exportCsvBtn.addEventListener('click', () => {
  const rows = [['session_id','barcode','format','quantity','timestamp_iso']];
  counts.forEach(c => rows.push([
    SESSION_ID,
    c.barcode,
    c.format || '',
    c.qty,
    new Date(c.ts).toISOString()
  ]));
  const csv = rows.map(r => r.map(cell => {
    const s = String(cell);
    return /[",\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s;
  }).join(',')).join('\n');
  const stamp = new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
  downloadFile(`physical-count_${SESSION_ID}_${stamp}.csv`, csv, 'text/csv');
  showToast('CSV downloaded');
});

exportJsonBtn.addEventListener('click', () => {
  const payload = {
    sessionId: SESSION_ID,
    exportedAt: new Date().toISOString(),
    counts: counts.map(c => ({
      barcode: c.barcode,
      format: c.format || null,
      quantity: c.qty,
      timestamp: new Date(c.ts).toISOString()
    }))
  };
  const stamp = new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);
  downloadFile(`physical-count_${SESSION_ID}_${stamp}.json`, JSON.stringify(payload, null, 2), 'application/json');
  showToast('JSON downloaded');
});

clearBtn.addEventListener('click', () => {
  if (!counts.length) return;
  if (!confirm(`Clear all ${counts.length} counted items? This starts a fresh session.`)) return;
  counts = [];
  // Regenerate session id
  const newId = 'S' + Date.now().toString(36).toUpperCase().slice(-6);
  localStorage.setItem('stockcount.sid', newId);
  sessionIdEl.textContent = newId;
  saveState();
  renderCounts();
  showToast('Session cleared', 'info');
});

// ─── Camera + scanning ───
async function startScanner() {
  clearError();

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showError('Camera API not supported. Use a recent Chrome, Safari, or Firefox on a mobile device. The page must be served over HTTPS (or localhost).');
    return;
  }
  if (!window.ZXingBrowser) {
    showError('Scanner library failed to load. Check your network connection and reload.');
    return;
  }

  try {
    codeReader = new ZXingBrowser.BrowserMultiFormatReader();
    await codeReader.decodeFromConstraints({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    }, videoEl, (result) => {
      if (!result) return;
      const text = result.getText();
      const fmt = result.getBarcodeFormat ? String(result.getBarcodeFormat()) : '';
      // Debounce identical scans within 1.5s to prevent spam
      const now = Date.now();
      if (text === lastScannedBarcode && (now - lastScanTime) < 1500) return;
      lastScannedBarcode = text;
      lastScanTime = now;
      setBarcode(text, fmt);
      qtyInput.focus();
      qtyInput.select();
      vibrate(60);
    });

    placeholder.classList.add('hidden');
    reticle.classList.add('active');
    scanning = true;
    toggleBtn.style.background = 'var(--success)';
    toggleBtn.style.borderColor = 'var(--success)';
    toggleBtn.style.color = '#1c1917';
  } catch (err) {
    console.error(err);
    let msg = 'Could not access the camera.';
    if (err.name === 'NotAllowedError') msg = 'Camera permission denied. Enable camera access in your browser settings and reload.';
    else if (err.name === 'NotFoundError') msg = 'No camera found on this device.';
    else if (err.name === 'NotReadableError') msg = 'Camera is in use by another app. Close it and try again.';
    else if (err.message) msg += ' (' + err.message + ')';
    showError(msg);
    stopScanner();
  }
}

function stopScanner() {
  if (codeReader) {
    try { codeReader.reset(); } catch(e) {}
    codeReader = null;
  }
  if (videoEl.srcObject) {
    videoEl.srcObject.getTracks().forEach(t => t.stop());
    videoEl.srcObject = null;
  }
  scanning = false;
  placeholder.classList.remove('hidden');
  reticle.classList.remove('active');
  toggleBtn.style.background = '';
  toggleBtn.style.borderColor = '';
  toggleBtn.style.color = '';
}

toggleBtn.addEventListener('click', () => scanning ? stopScanner() : startScanner());

// Pause scanning when tab is hidden to save battery
document.addEventListener('visibilitychange', () => {
  if (document.hidden && scanning) stopScanner();
});

// ─── Init ───
loadState();
renderCounts();
setBarcode('', '');
</script>
